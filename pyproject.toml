[project]
name = "fdatrack"
version = "0.1.0"
description = "What does FDA actually say about this product right now? An agent over openFDA with honest silence."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "mcp>=2.0",
    "anthropic>=0.40",
    "pyyaml>=6.0",
]

[project.scripts]
fdatrack = "cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "servers", "cli", "monitor", "evals"]
